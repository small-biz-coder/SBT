<!DOCTYPE html>
<html lang="en">
<head>
    <title>Thank You for contacting South Branch Trades</title>
    <meta name="description" content="Thank you for reaching out, we look forward to working with you.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="utf-8">
    <link rel="icon" type="image/x-icon" sizes="32x32" href="south-branch-favicon.ico">
    <link rel="icon" type="image/x-icon" sizes="180x180" href="south-branch-180favicon.ico">
    <link rel="stylesheet" type="text/css" href="critical-home.css">
    <link rel="preload" href="style.css" as="style" 
      onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
        <link rel="stylesheet" href="/css/local.css">
    </noscript>
    
</head>
<body>
<header id="header"></header>


<div id="thank-you">
    <picture>
    <img src="circle-check-big.svg" class="thanks-checkmark" width="40px" decoding="async" alt="checkmark with circle around it">
    </picture>
    <h1>Thank You!</h1>
    <p>We've received your message and look forward to working with you. In the meantime, have a look at some of our completed projects.</p>
    <div class="mail-response"><img src="mail-icon.svg" width="30px" decoding="async" alt="email graphic"><span>We respond within 24 hours</span></div>

    <button>
        <a href="portfolio.html" role="button">View Projects</a>
        <img src="btn-arrow.svg" width="40px" height="40px" decoding="async" loading="lazy" alt="">
    </button>
</div>


<footer id="footer"></footer>

<script type="module" src="script.js"></script>


</body>
</html>
